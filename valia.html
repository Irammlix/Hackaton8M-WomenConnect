<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WomenConnect — Valia IA</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/valia.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
    <img src="assets/WomenConnect-logo.png" alt="WomenConnect Logo" style="height: 32px; width: auto; display: block;">
   </div>
    <button class="btn-menu" onclick="abrirMenu()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="menu-movil" id="menu-movil">
    <nav>
      <a href="home.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12L12 3L21 12V20a1 1 0 0 1-1 1h-5v-5H9v5H4a1 1 0 0 1-1-1V12z"/></svg>Inicio</a>
      <a href="community.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="7" r="3"/><circle cx="15" cy="7" r="3"/><path d="M3 21c0-3 2.7-5 6-5h6c3.3 0 6 2 6 5"/></svg>Comunidad</a>
      <a href="valia.html" class="nav-link activo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Valia IA</a>
      <a href="ranking.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>Ranking</a>
      <a href="profile.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Mi Espacio</a>
      <a href="index.html" class="btn-salir" style="text-decoration: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar sesión
      </a>
    </nav>
  </div>

  <div class="layout chat-layout">
    <aside class="sidebar">
    <div class="topbar-logo">Women<em>Connect</em></div>
      <nav>
        <a href="home.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12L12 3L21 12V20a1 1 0 0 1-1 1h-5v-5H9v5H4a1 1 0 0 1-1-1V12z"/></svg>Inicio</a>
        <a href="community.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="7" r="3"/><circle cx="15" cy="7" r="3"/><path d="M3 21c0-3 2.7-5 6-5h6c3.3 0 6 2 6 5"/></svg>Comunidad</a>
        <a href="valia.html" class="nav-link activo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Valia IA</a>
        <a href="ranking.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>Ranking</a>
        <a href="profile.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>Mi Espacio</a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-usuario">
          <div class="avatar" id="avatar-letra">U</div>
          <div class="usuario-info"><span id="nombre-usuario">Usuaria</span><small>🔒 Protegida</small></div>
        </div>
          <a href="index.html" class="btn-salir" style="text-decoration: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
           Cerrar sesión
          </a>
      </div>
    </aside>

    <main class="contenido-chat">
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="valia-avatar">🛡</div>
          <div>
            <div class="chat-name">Valia</div>
            <div class="chat-status"><span class="dot-online"></span>En línea · Privado</div>
          </div>
        </div>
        <button class="btn-reset" onclick="nuevaConversacion()">↺ Nueva</button>
      </div>

      <div id="chat-mensajes" class="messages-area"></div>

      <div class="chat-controls">
        <div id="sugerencias" class="suggestions-grid">
          <button class="sugerencia" onclick="mensajeRapido('Quiero verificar una oferta de trabajo')">🛡 Verificar oferta</button>
          <button class="sugerencia" onclick="mensajeRapido('Necesito ayuda con mi CV')">📄 Mejorar CV</button>
          <button class="sugerencia" onclick="mensajeRapido('Quiero negociar mi salario')">💰 Negociar salario</button>
          <button class="sugerencia" onclick="mensajeRapido('Necesito apoyo emocional')">💙 Necesito apoyo</button>
        </div>

        <div class="input-container">
          <div class="input-box">
            <textarea id="chat-input" placeholder="Escríbele a Valia..." rows="1" onkeydown="teclaEnter(event)" oninput="ajustarAltura(this)"></textarea>
            <button class="btn-send" onclick="enviarMensaje()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <p class="privacy-disclaimer">🔒 Conversación encriptada y privada</p>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <script src="js/main.js"></script>
  <script src="js/valia.js"></script>
</body>
</html>
