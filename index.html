<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WomenConnect — Iniciar sesión</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="caja-login">
    <!-- Logo -->
    <div class="login-logo">
      <div class="circulo">♀</div>
      <h1>Women<em>Connect</em></h1>
      <p>Tu camino profesional, protegido</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab activo" id="tab-login" onclick="cambiarTab('login')">Iniciar sesión</button>
      <button class="tab" id="tab-registro" onclick="cambiarTab('registro')">Crear cuenta</button>
    </div>

    <!-- Formulario Login -->
    <div class="formulario activo" id="form-login">
      <div class="mensaje-error" id="error-login"></div>

      <div class="campo-grupo">
        <label class="campo-label">Correo electrónico</label>
        <input class="campo-input" id="login-email" type="email" placeholder="tu@correo.com">
      </div>

      <div class="campo-grupo">
        <label class="campo-label">Contraseña</label>
        <input class="campo-input" id="login-pass" type="password" placeholder="••••••••">
      </div>

      <button class="btn-login" onclick="iniciarSesion()">Entrar a WomenConnect</button>

      <div class="separador">o continúa con</div>

      <button class="btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="nota-privacidad">
        Tu identidad está protegida. Puedes participar de forma completamente anónima.
      </div>
    </div>

    <!-- Formulario Registro -->
    <div class="formulario" id="form-registro">
      <div class="mensaje-error" id="error-registro"></div>

      <div class="campo-grupo">
        <label class="campo-label">Correo electrónico</label>
        <input class="campo-input" id="reg-email" type="email" placeholder="tu@correo.com">
      </div>

      <div class="campo-grupo">
        <label class="campo-label">Contraseña</label>
        <input class="campo-input" id="reg-pass" type="password" placeholder="Mínimo 8 caracteres">
      </div>

      <div class="campo-grupo">
        <label class="campo-label">Confirmar contraseña</label>
        <input class="campo-input" id="reg-pass2" type="password" placeholder="Repite tu contraseña">
      </div>

      <!-- Toggle anonimato -->
      <div class="toggle-anon" onclick="toggleAnon()">
        <div class="check-caja" id="check-anon"></div>
        <div class="toggle-texto">
          <strong>Quiero ser anónima</strong>
          <span>Tu nombre no será visible en la comunidad</span>
        </div>
      </div>

      <button class="btn-login" onclick="registrarse()">Crear mi cuenta</button>

      <div class="separador">o regístrate con</div>

      <button class="btn-google" onclick="loginGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="nota-privacidad">
        Nunca compartiremos tus datos. Aceptas nuestros términos al registrarte.
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
